name: tromay CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.2"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ─────────────────────────────────────────────────────────
# JOB 1 — Tests PHP + auditoría de dependencias
# ─────────────────────────────────────────────────────────
jobs:
  test:
    name: Tests & Audit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tromay_test
          MYSQL_USER: tromay
          MYSQL_PASSWORD: test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          extensions: pdo_mysql, mbstring, bcmath, gd, zip, intl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP deps
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Composer audit
        run: composer audit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Build assets (Vite)
        run: npm run build

      - name: Copy .env for tests
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations (test DB)
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tromay_test
          DB_USERNAME: tromay
          DB_PASSWORD: test
        run: php artisan migrate --force

      - name: Run tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tromay_test
          DB_USERNAME: tromay
          DB_PASSWORD: test
        run: php artisan test --stop-on-failure

# ─────────────────────────────────────────────────────────
# JOB 2 — Build y push imagen Docker a GHCR
# Solo en push a main/master (no en PRs)
# ─────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────────────────
# JOB 3 — Deploy: servidor hace pull de la imagen nueva
# ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: GITHUB_SHA,GITHUB_REPOSITORY
          script: |
            set -euo pipefail

            cd "${{ secrets.DEPLOY_PATH }}/tromay"

            echo "🔄 Autenticando en GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Exportar versión a desplegar
            export APP_VERSION="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
            echo "Versión: $APP_VERSION"

            # Guardar imagen actual para rollback
            PREV_IMAGE=$(docker inspect --format='{{.Image}}' tromay-app-1 2>/dev/null || docker inspect --format='{{.Image}}' tromay_app_1 2>/dev/null || true)

            # Pull nueva imagen desde GHCR
            echo "📥 Pulling imagen nueva..."
            APP_VERSION=$APP_VERSION docker compose -f docker-compose.prod.yml pull app

            # Deploy sin downtime
            echo "🚀 Iniciando nueva versión..."
            APP_VERSION=$APP_VERSION docker compose -f docker-compose.prod.yml up -d --no-deps app

            # Migraciones y optimizaciones Laravel
            echo "⚙️ Ejecutando migraciones..."
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force

            echo "⚡ Cacheando configuración..."
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan view:cache

            # Health check post-deploy
            echo "🔍 Verificando salud del servicio..."
            SUCCESS=false
            for i in $(seq 1 20); do
              HTTP=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 3 http://localhost:8080/ 2>/dev/null || echo "000")
              if [ "$HTTP" = "200" ]; then
                echo "✅ Servicio OK (intento $i)"
                SUCCESS=true
                break
              fi
              echo "  [$i/20] HTTP $HTTP — esperando 5s..."
              sleep 5
            done

            if [ "$SUCCESS" = "false" ]; then
              echo "❌ Health check falló — iniciando rollback..."
              if [ -n "$PREV_IMAGE" ]; then
                docker tag "$PREV_IMAGE" "ghcr.io/${{ github.repository }}:rollback" 2>/dev/null || true
                APP_VERSION=rollback docker compose -f docker-compose.prod.yml up -d --no-deps app
                echo "🔄 Rollback a imagen anterior completado."
              fi
              exit 1
            fi

            echo "✅ Deploy de tromay completado — $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `🚨 Deploy tromay falló — ${context.sha.substring(0, 7)}`,
              body: `**Branch:** ${context.ref}\n**Actor:** ${context.actor}\n**Commit:** ${context.sha}`,
              labels: ['deploy-failure']
            })
