server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # ── Security headers (backup — app middleware is primary) ────────
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Static assets — 1-year immutable cache ───────────────────────
    # Vite outputs hashed filenames so long-term caching is safe
    location ~* ^/build/.+\.(css|js|woff2?|ttf|otf|eot|svg|ico|png|jpg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Public assets without hash — shorter cache
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # ── Laravel application ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM passthrough ──────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass            127.0.0.1:9000;
        fastcgi_index           index.php;
        fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include                 fastcgi_params;

        fastcgi_read_timeout    60;
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;

        # Pass real IP from upstream proxy (Caddy/Traefik)
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # ── Block direct access to sensitive files ────────────────────────
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
