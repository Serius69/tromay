name: Kapitalya CI/CD

# ══════════════════════════════════════════════════════════════════════
#  Estrategia de branches:
#   dev     →  Solo tests (feedback rapido)
#   staging →  Tests completos + build imagen
#   main    →  Tests + Build + Deploy a produccion
# ══════════════════════════════════════════════════════════════════════
on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging]

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

# ──────────────────────────────────────────────────────────────────────
# JOB 1 — Tests (corre en TODOS los branches)
# ──────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: Tests & Security Audit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kapitalya_test
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_mysql, zip, gd, opcache
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: vendor-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies & build assets
        run: npm ci && npm run build

      - name: Prepare test environment
        run: |
          cp env/.env.test .env
          php artisan key:generate --force
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_DATABASE: kapitalya_test
          DB_USERNAME: root
          DB_PASSWORD: secret

      - name: Run migrations
        run: php artisan migrate:fresh --force
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_DATABASE: kapitalya_test
          DB_USERNAME: root
          DB_PASSWORD: secret

      - name: Run test suite
        run: php artisan test --env=testing
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_DATABASE: kapitalya_test
          DB_USERNAME: root
          DB_PASSWORD: secret

      - name: Composer security audit
        run: composer audit

  # ──────────────────────────────────────────────────────────────────────
  # JOB 2 — Build Docker (staging + main solamente)
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') &&
      github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.sha }}

  # ──────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy a Staging (branch: staging)
  # ──────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Staging via SSH
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,IMAGE
          script: |
            set -e
            cd /srv/kapitalya-staging

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker compose -f docker-compose.test.yml pull app

            docker compose -f docker-compose.test.yml up -d --no-deps --wait app
            docker compose -f docker-compose.test.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.test.yml exec -T app php artisan config:cache

            docker image prune -f

  # ──────────────────────────────────────────────────────────────────────
  # JOB 4 — Deploy a Produccion (branch: main)
  # ──────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,IMAGE
          script: |
            set -e
            cd /srv/kapitalya

            PREVIOUS_TAG=$(docker inspect kapitalya_app --format='{{.Config.Image}}' 2>/dev/null || echo "")

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker compose -f docker-compose.prod.yml pull app

            docker compose -f docker-compose.prod.yml up -d --no-deps --wait app

            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan view:cache

            for i in {1..6}; do
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost/api/rates || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Health check OK (intento $i)"
                break
              fi
              echo "Intento $i — HTTP $STATUS, reintentando..."
              sleep 5
              if [ $i -eq 6 ]; then
                echo "Health check fallo — rollback a $PREVIOUS_TAG"
                docker compose -f docker-compose.prod.yml up -d --no-deps app
                exit 1
              fi
            done

            docker image prune -f

      - name: Verify production endpoint
        run: |
          sleep 5
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            "https://${{ secrets.DEPLOY_HOST }}/api/rates" || echo "000")
          echo "Produccion health: HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1
