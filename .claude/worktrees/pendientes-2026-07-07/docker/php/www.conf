[www]
user  = www-data
group = www-data

listen = 127.0.0.1:9000

pm                   = dynamic
pm.max_children      = 25
pm.start_servers     = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10

; Reinicia workers después de N requests para prevenir memory leaks
pm.max_requests = 500

request_terminate_timeout = 30

; Variables de entorno necesarias para Laravel
clear_env = no
